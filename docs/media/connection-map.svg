<svg xmlns="http://www.w3.org/2000/svg" width="540" height="460" viewBox="0 0 540 460" role="img" aria-labelledby="title desc"><title id="title">FITA browser connection map</title><desc id="desc">The local FITA app pairs with the browser extension, which connects an explicitly selected Tripo Studio tab.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto-start-reverse"><path d="M0 0L6 4L0 8" fill="none" stroke="#49BCF3" stroke-width="1.5"/></marker></defs><rect width="540" height="460" rx="20" fill="#0B0F17"/><text x="270" y="38" text-anchor="middle" fill="#AABACB" font-family="Segoe UI,Arial,sans-serif" font-size="17" letter-spacing="2">CONNECTION MAP</text><g fill="#151C28" stroke="#2A3B4D"><rect x="56" y="60" width="428" height="92" rx="16"/><rect x="56" y="208" width="428" height="92" rx="16"/><rect x="56" y="356" width="428" height="80" rx="16"/></g><g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle"><g fill="#F1F6FB" font-size="25" font-weight="600"><text x="270" y="99">FITA</text><text x="270" y="247">Browser extension</text><text x="270" y="390">Tripo Studio</text></g><g fill="#AABACB" font-size="17"><text x="270" y="128">Local app on your computer</text><text x="270" y="276">Install once in the Tripo browser</text><text x="270" y="418">One selected tab, your account</text></g><g fill="#76D2FF" font-size="17"><text x="270" y="185">Pair the browser</text><text x="270" y="333">Connect + authorize commands</text></g></g><path d="M270 157V166M270 193V201M270 306V314M270 341V350" stroke="#49BCF3" stroke-width="2" marker-end="url(#arrow)"/></svg>